---
- name: Assert prerequisites are present
  ansible.builtin.assert:
    that:
      - borg_backup_passphrase is defined and borg_backup_passphrase | length > 0
      - borg_backup_ssh_private_key is defined and borg_backup_ssh_private_key | length > 0
      - borg_backup_keyfile is defined and borg_backup_keyfile | length > 0
      - borg_backup_remote_known_hosts | length > 0
    fail_msg: >-
      Prereqs missing. Supply the three secrets (borg_backup_passphrase,
      borg_backup_ssh_private_key, borg_backup_keyfile) via your
      group_vars/vault layer, and populate borg_backup_remote_known_hosts with the
      remote's pinned SSH host-key lines (auto-trusting on first connect
      defeats the point of pinning).

- name: Determine whether Healthchecks pinging is enabled
  # Presence-based, no separate flag: enabled when a UUID is supplied. When the
  # UUID is unset, the success ping, the UUID file, and the OnFailure ping unit
  # are all skipped.
  ansible.builtin.set_fact:
    borg_backup_healthchecks_enabled: "{{ borg_backup_healthchecks_uuid is defined and (borg_backup_healthchecks_uuid | length) > 0 }}"

- name: Install pinned borgbackup package
  ansible.builtin.apt:
    name: "borgbackup={{ borg_backup_package_version }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install curl (Healthchecks ping dependency)
  # Used by both the success ping in borg-create.sh and the OnFailure unit;
  # the Debian 12 LXC template doesn't ship it by default. Only needed when
  # Healthchecks pinging is enabled.
  ansible.builtin.apt:
    name: curl
    state: present
  when: borg_backup_healthchecks_enabled | bool

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ borg_backup_ssh_dir }}"
    state: directory
    owner: "{{ borg_backup_user }}"
    group: "{{ borg_backup_user }}"
    mode: '0700'

- name: Deploy borg SSH private key
  ansible.builtin.copy:
    content: "{{ borg_backup_ssh_private_key }}"
    dest: "{{ borg_backup_ssh_private_key_path }}"
    owner: "{{ borg_backup_user }}"
    group: "{{ borg_backup_user }}"
    mode: '0600'
  no_log: true

- name: Ensure no stale .pub sits next to the borg SSH private key
  # OpenSSH reads `<key>.pub` (when present) to decide which pubkey to OFFER
  # the server. If the sibling .pub doesn't match the private key, ssh
  # advertises the wrong key and the server rejects auth — even when the
  # correct private key is in place. We don't need .pub on disk: with no
  # .pub present, OpenSSH derives the pubkey from the private key in memory.
  ansible.builtin.file:
    path: "{{ borg_backup_ssh_private_key_path }}.pub"
    state: absent

- name: Deploy pinned remote known_hosts entries
  ansible.builtin.template:
    src: known_hosts.j2
    dest: "{{ borg_backup_known_hosts_path }}"
    owner: "{{ borg_backup_user }}"
    group: "{{ borg_backup_user }}"
    mode: '0644'

- name: Ensure borg keyfile directory exists
  ansible.builtin.file:
    path: "{{ borg_backup_keyfile_dir }}"
    state: directory
    owner: "{{ borg_backup_user }}"
    group: "{{ borg_backup_user }}"
    mode: '0700'

- name: Ensure borg security directory exists
  # Must pre-exist so the systemd unit's ReadWritePaths can bind-mount it
  # writable; borg creates per-repo subdirs here on every connection.
  ansible.builtin.file:
    path: "{{ borg_backup_security_dir }}"
    state: directory
    owner: "{{ borg_backup_user }}"
    group: "{{ borg_backup_user }}"
    mode: '0700'

- name: Deploy borg keyfile
  ansible.builtin.copy:
    content: "{{ borg_backup_keyfile }}"
    dest: "{{ borg_backup_keyfile_path }}"
    owner: "{{ borg_backup_user }}"
    group: "{{ borg_backup_user }}"
    mode: '0600'
  no_log: true

- name: Ensure secrets directory exists
  ansible.builtin.file:
    path: "{{ borg_backup_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy borg passphrase
  # | trim guards against a trailing newline in the vault entry — a common
  # editor habit that would otherwise corrupt the passphrase by appending
  # a newline byte (BORG_PASSCOMMAND -> cat passes the file through verbatim).
  ansible.builtin.copy:
    content: "{{ borg_backup_passphrase | trim }}"
    dest: "{{ borg_backup_secrets_dir }}/passphrase"
    owner: root
    group: root
    mode: '0400'
  no_log: true

- name: Deploy Healthchecks UUID
  # Same rationale as the passphrase: trailing whitespace would end up in
  # the URL passed to curl. trim is safe — UUIDs contain no whitespace.
  # Only deployed when Healthchecks pinging is enabled.
  ansible.builtin.copy:
    content: "{{ borg_backup_healthchecks_uuid | trim }}"
    dest: "{{ borg_backup_secrets_dir }}/healthchecks_uuid"
    owner: root
    group: root
    mode: '0400'
  no_log: true
  when: borg_backup_healthchecks_enabled | bool

- name: Ensure borg cache directory exists
  # systemd's ReadWritePaths in borg-create.service only allows writes to
  # paths that already exist at unit start — pre-create the cache dir so
  # ProtectHome=read-only doesn't lock borg out of its own cache.
  ansible.builtin.file:
    path: "{{ borg_backup_user_home }}/.cache/borg"
    state: directory
    owner: "{{ borg_backup_user }}"
    group: "{{ borg_backup_user }}"
    mode: '0700'

- name: Template borg-create wrapper
  ansible.builtin.template:
    src: borg-create.sh.j2
    dest: "{{ borg_backup_create_script }}"
    owner: root
    group: root
    mode: '0750'

- name: Template borg-prune wrapper
  ansible.builtin.template:
    src: borg-prune.sh.j2
    dest: "{{ borg_backup_prune_script }}"
    owner: root
    group: root
    mode: '0750'

- name: Template systemd service unit
  ansible.builtin.template:
    src: borg-create.service.j2
    dest: "/etc/systemd/system/{{ borg_backup_create_service }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Template systemd timer unit
  ansible.builtin.template:
    src: borg-create.timer.j2
    dest: "/etc/systemd/system/{{ borg_backup_create_timer }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Template OnFailure ping unit (templated, instantiated by failing units)
  # Only deployed when Healthchecks pinging is enabled; the service unit's
  # OnFailure= line is likewise gated on the same condition.
  ansible.builtin.template:
    src: borg-failure@.service.j2
    dest: "/etc/systemd/system/{{ borg_backup_failure_service }}"
    owner: root
    group: root
    mode: '0644'
  when: borg_backup_healthchecks_enabled | bool
  notify: Reload systemd

- name: Remove Healthchecks UUID file when pinging is disabled
  ansible.builtin.file:
    path: "{{ borg_backup_secrets_dir }}/healthchecks_uuid"
    state: absent
  when: not (borg_backup_healthchecks_enabled | bool)

- name: Remove OnFailure ping unit when Healthchecks pinging is disabled
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ borg_backup_failure_service }}"
    state: absent
  when: not (borg_backup_healthchecks_enabled | bool)
  notify: Reload systemd

- name: Flush handlers so the timer enable below uses the latest unit files
  ansible.builtin.meta: flush_handlers

- name: Detect whether a backup is currently in flight
  # `borg list` takes an exclusive repo lock, which collides with a running
  # `borg-create.service`. If a backup is in flight we skip the smoke test —
  # a successfully running backup is stronger proof of correctness anyway.
  ansible.builtin.systemd:
    name: borg-create.service
  register: borg_backup_create_state
  check_mode: false

- name: Verify borg repo is reachable (read-only smoke test)
  # `borg list` exercises SSH connectivity, host-key pinning, repo
  # authentication (keyfile + passphrase), and the BORG_RSH plumbing in
  # one shot. Read-only — does not modify the repo. Failing here at apply
  # time beats failing silently at the first 03:30 UTC tick.
  # Skipped in --check because the keyfile/passphrase aren't actually on
  # disk yet — there's no useful preview to give.
  when:
    - not ansible_check_mode
    - borg_backup_create_state.status.ActiveState not in ["active", "activating"]
  ansible.builtin.shell: |
    set -euo pipefail
    export BORG_REPO="{{ borg_backup_repo }}"
    export BORG_PASSCOMMAND="cat {{ borg_backup_secrets_dir }}/passphrase"
    export BORG_KEY_FILE="{{ borg_backup_keyfile_path }}"
    export BORG_RSH="ssh -p {{ borg_backup_ssh_port }} -i {{ borg_backup_ssh_private_key_path }} -o UserKnownHostsFile={{ borg_backup_known_hosts_path }} -o StrictHostKeyChecking=yes -o BatchMode=yes -o PasswordAuthentication=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10"
    borg list --short >/dev/null
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false

- name: Enable and start borg-create.timer
  # Skipped in --check because the unit file isn't physically on disk yet,
  # so systemctl can't find it. Real run handles it normally.
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: "{{ borg_backup_create_timer }}"
    enabled: true
    state: started
